services:
  app:
    build:
      context: .
      args:
        VERAPDF_VERSION: "1.30"
        VERAPDF_PATCH_VERSION: "2"
    restart: unless-stopped
    read_only: true
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAX_UPLOAD_BYTES: "20971520"
      VALIDATION_TIMEOUT_SECONDS: "60"
      MAX_CONCURRENT_SCANS: "1"
    tmpfs:
      - /scan-tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2.0

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
